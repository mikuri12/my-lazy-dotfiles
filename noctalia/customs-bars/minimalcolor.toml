[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true
directory = "/home/miku/Videos/Recordings"
video_encoder = "cpu"
video_qp = 20
video_source = "focused"

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/miku/wallpapers/para cambiarles el tema"

[plugins]
auto_update = "all"
enabled = [
    "noctalia/screen_recorder",
    "yocraft/desktop-launcher",
    "ezequiel/mango_layouts",
    "ezequielgk/profiles",
    "noctalia/wallhaven",
    "ezequielgk/wallpaper-widget",
    "soul/palettes",
    "decksters-lab/palette-creator",
    "kavya-nama/wallpaper-switcher",
    "reaperhound/ambient-sounds"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/ezequielgk/My-Lazy-Plugins"
    name = "My-Lazy-Plugins"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/ezequielgk/My-Lazy-Plugins"
    name = "ezequiel"

[shell]
app_icon_colorize = true
avatar_path = "/home/miku/Pictures/mymy/09571c8e1c9b2cf68a9c6e51707d0a7f.jpg"
clipboard_history_max_entries = 20
corner_radius_scale = 0.0
font_family = "BigBlueTermPlus Nerd Font"
polkit_agent = true
popup_shadows = false
screen_time_enabled = true
telemetry_enabled = false

    [shell.animation]
    enabled = false

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    app_grid = true
    categories = false
    compact = true
    fetch_exchange_rates = false
    show_app_origin_indicator = false
    show_icons = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    floating_layer = "top"
    floating_offset = 6
    launcher_placement = "attached"
    launcher_position = "auto"
    list_item_background = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    polkit_placement = "attached"
    session_placement = "floating"
    shadow = true
    transparency_mode = "solid"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    confirm_region = true
    save_to_file = false

    [shell.session]
    grid_columns = 1

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Noctalia"
community_palette = "Cream Autumn"
custom_palette = "Live"
mode = "light"
shell_mode = "light"
source = "custom"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "cava", "foot", "helix", "mango", "qt" ]
    community_ids = [ "opencode", "zed" ]

[wallpaper]
directory = "/home/miku/wallpapers"
fill_color = "primary"

    [wallpaper.default]
    path = "/home/miku/wallpapers/para cambiarles el tema/wallhaven-od26vm_1920x1080.png"

    [wallpaper.last]
    path = "/home/miku/wallpapers/para cambiarles el tema/wallhaven-od26vm_1920x1080.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/miku/wallpapers/para cambiarles el tema/wallhaven-od26vm_1920x1080.png"

    [wallpaper.monitors.VGA-1]
    path = "/usr/share/backgrounds/moony-art3.png"

    [[wallpaper.favorite]]
    path = "/home/miku/wallpapers/shinonome/para cambiarles el tema/light/wallhaven-8gdjyy_1920x1080.png"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    path = "/home/miku/wallpapers/para cambiarles el tema/wallhaven-01kz5v_1920x1080.png"
    theme_mode = "auto"

